<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#081016">
    <title>VKF 0.6.0 live GPU water</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #081016; color: #edf5f3; }
      body { min-height: 100dvh; display: grid; place-items: center; }
      main { width: min(100%, 980px); padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom)); }
      header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 2px 3px 10px; }
      h1 { margin: 0; font-size: clamp(17px, 4.8vw, 24px); font-weight: 720; }
      header a { color: #9bdbe1; font-size: 13px; }
      .stage { overflow: hidden; border: 1px solid #2b3c43; border-radius: 14px; background: #071016; box-shadow: 0 20px 70px rgb(0 0 0 / .35); }
      .bar { min-height: 54px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 7px; border-bottom: 1px solid #2b3c43; background: #101c22; }
      button { min-height: 40px; border: 1px solid #52636a; border-radius: 9px; padding: 0 13px; color: inherit; background: #17242b; font: inherit; font-weight: 650; touch-action: manipulation; }
      button[aria-pressed="true"] { background: #dcebe7; color: #102028; border-color: #dcebe7; }
      .status { margin-left: auto; color: #bed0cd; font-size: 13px; font-variant-numeric: tabular-nums; }
      canvas { width: 100%; aspect-ratio: 5 / 3; display: block; background: #071016; touch-action: none; }
      .error { margin: 0; padding: 12px; color: #ffb4ab; white-space: pre-wrap; }
      footer { padding: 9px 3px 0; color: #9fb0b5; font-size: 13px; line-height: 1.45; }
      footer strong { color: #dcebe7; }
      @media (max-width: 620px) {
        main { padding-left: 0; padding-right: 0; }
        header, footer { padding-left: 10px; padding-right: 10px; }
        .stage { border-left: 0; border-right: 0; border-radius: 0; }
        .bar { align-items: stretch; }
        .status { width: 100%; margin: 0; padding: 2px 2px 0; }
        canvas { aspect-ratio: 4 / 3; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Live GPU water <small>· 0.6.0 preview</small></h1>
        <a href="https://github.com/vektor-flow/site/tree/working/site-migration-0084/public/previews/0.6.0/live-gpu/water">Source</a>
      </header>
      <section class="stage" aria-label="Interactive water simulation">
        <div class="bar" aria-label="Simulation controls">
          <button id="play" type="button" aria-pressed="true">Pause</button>
          <button id="reset" type="button">Reset</button>
          <button id="fluid" type="button" aria-pressed="true">Fluid</button>
          <button id="particles" type="button" aria-pressed="false">Particles</button>
          <span id="status" class="status" role="status" aria-live="polite">Starting WebGPU…</span>
        </div>
        <canvas id="water" width="900" height="540" aria-label="Real-time two-dimensional GPU water flowing over a stone"></canvas>
        <pre id="error" class="error" role="alert" hidden></pre>
      </section>
      <footer><strong>This is live, not a video.</strong> Particle interaction, collision, foam state, and surface embedding execute as GPU passes. This is active 0.6.0 research, not a released feature.</footer>
    </main>
    <script type="module" src="./scene.mjs"></script>
  </body>
</html>
