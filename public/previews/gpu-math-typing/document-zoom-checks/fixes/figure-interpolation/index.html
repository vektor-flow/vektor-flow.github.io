<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document zoom grid · Vektor Flow</title><style>*{box-sizing:border-box}body{font:15px/1.45 system-ui;background:#edf2ed;color:#18322c;margin:0}main{max-width:1050px;margin:auto;padding:12px}h1{font-size:23px}a{color:inherit}select,button{font:inherit;min-height:44px;max-width:100%}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}img{max-width:100%;height:auto;background:white;display:block}img[hidden]{display:none}#overview{cursor:crosshair;max-height:65vh;width:auto;max-width:100%;object-fit:contain;object-position:left top}#result{font-weight:650;color:#923524}details{margin:12px 0}summary{padding:10px 0;min-height:44px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#tile-image{max-width:100%;width:1024px}#tile-metrics{overflow-wrap:anywhere}.proof{display:grid;grid-template-columns:1fr 1fr;gap:10px}.proof img{width:100%}@media(max-width:600px){.proof{grid-template-columns:1fr}h1{font-size:21px}}</style><main><a href="../../../document.html">Renderer</a> · <a href="../../../document-checks/">Original comparison</a><h1>Full-document zoom grids</h1><p id="result"></p><p id="snapshot"></p><p id="follow-up"></p><p id="scope"></p><details><summary>High-zoom bar checks</summary><p id="bar-summary"></p><div class="proof"><figure><figcaption>Before · 28.6×</figcaption><img src="./rule-before.png" alt="Blurred square-root bar before correction"></figure><figure><figcaption>After · 28.6×</figcaption><img src="./rule-after.png" alt="Sharp square-root bar after correction"></figure></div></details><div class="controls"><select id="doc" aria-label="Document"></select><select id="page" aria-label="Page"></select><select id="zoom" aria-label="Zoom level"></select></div><p id="metrics"></p><p>Every outlined cell was checked, including blank cells. Red: failed tile. Green: passed tile. Tap a grid cell to inspect it.</p><img id="overview" alt="Complete checked page grid"><div class="controls"><select id="tile" aria-label="Tile"></select><select id="view" aria-label="Tile view"><option value="reference">PDF reference</option><option value="gpu">GPU output</option><option value="error">Local errors</option></select></div><p id="tile-metrics"></p><p id="blank" hidden>Both tile cores are blank.</p><img id="tile-image" alt="Selected full-resolution tile"><p id="tile-link"></p><details><summary>Coverage, rasterizer and provenance</summary><pre id="provenance"></pre></details></main><script type="module">
const $=id=>document.getElementById(id),data=await fetch('./report.json').then(r=>r.json()),percent=v=>(100*v).toFixed(3)+'%',pad=n=>String(n).padStart(2,'0');let doc,page,level;
$('snapshot').textContent=data.snapshotLabel??'Saved full-document zoom scan';for(const fix of data.followUps??[]){const a=document.createElement('a');a.textContent=fix.label;a.href=fix.href;$('follow-up').append(a);}
const pages=data.documents.flatMap(d=>d.pages),levels=pages.flatMap(p=>p.levels),tiles=levels.flatMap(l=>l.tiles);$('result').textContent=(data.complete?'Complete grid scan':'Incomplete grid scan')+' · '+(data.accepted?'accuracy checks passed':'accuracy checks have not passed');$('scope').textContent=`${data.documents.reduce((n,d)=>n+d.referencePages,0)} original PDF pages and ${data.documents.reduce((n,d)=>n+d.gpuPages,0)} GPU pages · ${data.zooms.map(z=>z+'×').join(', ')} · ${tiles.length} tiles. Every pixel is covered at these levels. Higher zooms are targeted bar checks, not exhaustive document scans.`;$('bar-summary').textContent=data.ruleChecks?`${data.ruleChecks.checks.length} checks: radicals, fractions, over/underlines, box borders, table rules, brace connectors and arrow shafts at 1×, 4×, 16×, 28.6× and 64×. Magnified edge profiles pass. Software WebGPU; physical phone qualification remains open.`:'Bar checks pending';$('provenance').textContent=JSON.stringify({coverage:data.coverage,rasterizer:data.rasterizer,backend:data.backend,runtimeHashes:data.runtimeHashes,geometry:data.geometryVerification,errors:data.errors,gpuErrors:data.gpuErrors,policy:'At least99.5% reference AND GPU ink covered within one physical pixel; local component coverage>=95%; same page bounds/count. Original independent glyph-placement audit remains required. Native PDFs unchanged. This new grid uses MuPDF; original comparison uses Poppler, so their raw scores differ.'},null,2);
function options(id,items){$(id).replaceChildren(...items.map(([value,text])=>new Option(text,value)));}
options('doc',data.documents.map((d,i)=>[i,d.name]));
function selectDoc(){doc=data.documents[Number($('doc').value)];options('page',doc.pages.map((p,i)=>[i,`Page ${p.number}${!p.referencePresent?' · extra GPU page':!p.gpuPresent?' · missing GPU page':''}`]));selectPage();}
function selectPage(){page=doc.pages[Number($('page').value)];options('zoom',page.levels.map((l,i)=>[i,l.zoom+'×']));selectZoom();}
function folder(){return './'+doc.name+'/page-'+pad(page.number)+'/zoom-'+level.zoom+'/';}
function selectZoom(){level=page.levels[Number($('zoom').value)];$('overview').src=folder()+'grid.png';$('metrics').textContent=`${level.columns} × ${level.rows} grid · ${level.width} × ${level.height} output pixels · raw ink overlap ${percent(level.inkIoU)} · ink within1px ${percent(level.coverageWithin1px)} · ${level.passed?'passed':'failed'} · glyph placement ${level.geometryPassed?'passed':'failed'}${!page.referencePresent?' · reference page missing':''}`;options('tile',level.tiles.map((t,i)=>[i,`${t.row+1},${t.column+1} · ${t.passed?'pass':'fail'} · ${percent(t.coverageWithin1px)}`]));const worst=level.tiles.reduce((a,b)=>(b.missingBeyond1px+b.extraBeyond1px>a.missingBeyond1px+a.extraBeyond1px)?b:a);$('tile').value=level.tiles.indexOf(worst);selectTile();}
function selectTile(){const tile=level.tiles[Number($('tile').value)],path=tile.evidence?folder()+tile.evidence+'-'+$('view').value+'.png':null;$('tile-image').hidden=!path;$('blank').hidden=!!path;if(path)$('tile-image').src=path;$('tile-metrics').textContent=`Core x=${tile.x}, y=${tile.y}, ${tile.width}×${tile.height}px · overlap ${percent(tile.inkIoU)} · within1px ${percent(tile.coverageWithin1px)} · ${tile.missingBeyond1px} missing / ${tile.extraBeyond1px} extra ink pixels beyond1px · ${tile.badComponents} local component failures · RGB error on ink ${((tile.meanAbsoluteRGBErrorOnInkUnion??0)*100).toFixed(3)}%`;$('tile-link').replaceChildren();if(path){const a=document.createElement('a');a.href=path;a.textContent='Open full-resolution tile';$('tile-link').append(a);}}
$('doc').onchange=selectDoc;$('page').onchange=selectPage;$('zoom').onchange=selectZoom;$('tile').onchange=selectTile;$('view').onchange=selectTile;$('overview').onclick=event=>{const r=$('overview').getBoundingClientRect(),column=Math.min(level.columns-1,Math.floor((event.clientX-r.left)/r.width*level.columns)),row=Math.min(level.rows-1,Math.floor((event.clientY-r.top)/r.height*level.rows));$('tile').value=level.tiles.findIndex(t=>t.column===column&&t.row===row);selectTile();};selectDoc();
</script></html>
