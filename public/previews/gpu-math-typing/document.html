<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LaTeX documents · Vektor Flow</title><style>
*{box-sizing:border-box}html{height:100%;overflow:hidden;overscroll-behavior:none}body{height:100dvh;overflow:hidden;overscroll-behavior:none;font:16px/1.4 system-ui;margin:0;background:#edf2ed;color:#18322c}main{display:flex;flex-direction:column;height:100%;min-height:0;max-width:1050px;margin:auto;padding:0 12px 16px}a{color:inherit}button,input,select{font:inherit;min-height:44px;max-width:100%}button{background:#143026;color:white;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#dce6dd;color:#18322c}header{flex:none;position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;min-height:60px;background:#edf2edf5;backdrop-filter:blur(12px);padding:8px 0}h1{font-size:18px;margin:0 auto 0 0;white-space:nowrap}#navigation{position:relative;margin:0}#navigation summary{list-style:none;padding:10px;min-height:44px}#navigation summary::-webkit-details-marker{display:none}#navigation nav{position:absolute;right:0;top:44px;background:white;box-shadow:0 3px 18px #0002;border-radius:8px;padding:8px;min-width:170px}nav a{display:block;padding:10px}#editor[hidden]{display:none}#editor{flex:0 1 auto;min-height:0;max-height:50%;overflow:auto;overscroll-behavior:contain;padding-bottom:8px}textarea{display:block;width:100%;height:clamp(140px,28dvh,280px);font:16px/1.4 monospace;padding:10px;border:1px solid #bccbbf;border-radius:8px;resize:vertical}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.files{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 0}.file{min-width:0}.file span{display:block;font-size:13px;margin-bottom:4px}.file input{width:100%;font-size:14px}details{font-size:13px}summary{padding:10px 0;cursor:pointer;min-height:44px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#view-tools{flex:none;display:flex;gap:8px;align-items:start;margin:0 0 8px}#gesture-hint{font-size:12px;margin:0;align-self:center;color:#4b6258}#gesture-hint output{font-variant-numeric:tabular-nums;margin-right:6px;color:#18322c}nav label{display:block;padding:8px}nav label[hidden]{display:none}nav select{width:100%;font-size:14px}nav button{display:block;width:100%;text-align:left;background:white;color:inherit}#render-info{margin-left:auto;text-align:right;max-width:55%}#render-info summary{overflow-wrap:anywhere}#render-info[open]{max-height:30dvh;overflow:auto;overscroll-behavior:contain;text-align:left;max-width:100%;width:100%}#view-tools:has(#render-info[open]){flex-wrap:wrap}#status,#timing{font-size:13px;margin:6px 0}#pages{position:relative;flex:1;min-height:80px;overflow:hidden;touch-action:none;overscroll-behavior:none;background:white;border-radius:4px}canvas[hidden]{display:none}canvas{touch-action:none;cursor:grab;user-select:none;display:block;width:min(100%,816px);height:auto;background:white;box-shadow:0 1px 7px #0002}#pages.dragging canvas{cursor:grabbing}#notice{font-size:13px;margin:0 0 6px}#notice:empty{display:none}@media(max-width:600px){main{padding:0 8px max(12px,env(safe-area-inset-bottom))}header{min-height:56px;gap:6px}h1{font-size:17px}header button{padding:8px 12px}#navigation summary{padding:10px 6px}.files{grid-template-columns:1fr}#pages{min-height:60px}#view-tools{gap:6px}#render-info summary{font-size:12px}#render-info{max-width:46%}}
</style></head><body><main>
<header><h1>LaTeX</h1><button id="edit-toggle" class="secondary" aria-expanded="true" aria-controls="editor">Hide editor</button><button id="render" disabled>Render</button><details id="navigation"><summary aria-label="More pages">•••</summary><nav><label id="page-nav" hidden>Page<select id="document-page" aria-label="Document page"></select></label><button id="fit-text">Fit text</button><button id="reset-view">Fit page</button></nav></details></header>
<section id="editor" aria-label="Document editor">
<textarea id="document" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off" aria-label="LaTeX document">\documentclass{article}
\usepackage{amsmath,amssymb,graphicx,xcolor}
\begin{document}
\section{Math on the GPU}
Regular text and inline math $E=mc^2$ share native LaTeX fonts.
\begin{equation}
\sqrt[3]{x}+\binom{n}{k}=\frac{a}{b}
\end{equation}
\begin{align}
x&amp;=y+1\\[3pt]
z&amp;=\sqrt{x^2+y^2}
\end{align}
\end{document}</textarea>
<details id="files-panel"><summary>Files &amp; images</summary><div class="files"><label class="file"><span>Open .tex</span><input id="tex-file" type="file" accept=".tex,.txt"></label><label class="file"><span>Image assets</span><input id="image-files" type="file" accept="image/*" multiple></label></div></details></section>
<div id="view-tools"><p id="gesture-hint"><output id="zoom-value" aria-label="Document zoom">1×</output> Drag · Pinch or scroll to zoom</p><details id="render-info"><summary id="render-summary">Loading…</summary><p id="timing"></p><p id="status" role="status">Loading native symbol atlas…</p><pre id="diagnostics"></pre><p>Document layout is experimental.</p></details></div>
<p id="notice" role="status"></p><div id="pages" aria-label="Rendered document"></div></main><script type="module" src="./document-demo.mjs"></script></body></html>
