<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VKF display-only star transport</title>
  <link rel="stylesheet" href="./vf-frame.css" />
  <script src="./vf-frame.js"></script>
  <script src="./vf-alpha-hit-mask.js"></script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    #layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    #vf-transport-star {
      position: absolute;
      left: calc(50% - 90px);
      top: calc(50% - 90px);
      width: 180px;
      height: 180px;
      overflow: visible;
      pointer-events: auto;
      touch-action: none;
      cursor: grab;
      user-select: none;
      visibility: hidden;
    }

    #vf-transport-star[data-mask-ready="1"] {
      visibility: visible;
    }

    #vf-transport-star[data-vf-frame-dragging="1"] {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <div id="layer">
    <svg id="vf-transport-star" viewBox="0 0 100 100" aria-label="Draggable star">
      <defs>
        <radialGradient id="star-fill" cx="35%" cy="25%" r="80%">
          <stop offset="0" stop-color="#fff6a2" />
          <stop offset="0.46" stop-color="#ffd43b" />
          <stop offset="1" stop-color="#ff8a00" />
        </radialGradient>
      </defs>
      <polygon
        points="50,1 61.5,35 97,36.5 68.5,57.5 78.5,92 50,72 21.5,92 31.5,57.5 3,36.5 38.5,35"
        fill="url(#star-fill)"
        stroke="#fff4ad"
        stroke-width="1.4"
        stroke-linejoin="round"
      />
    </svg>
  </div>
  <script>
    (function () {
      "use strict";

      var layer = document.getElementById("layer");
      var star = document.getElementById("vf-transport-star");
      var localAlphaRegions = [];
      var dragActive = false;

      globalThis.__vfHasStandaloneDisplayContent = true;

      function starHitRegions() {
        var bounds = star.getBoundingClientRect();
        return VfAlphaHitMask.translate(localAlphaRegions, bounds.left, bounds.top);
      }

      function publishStarTransport() {
        VfFrame.postNativeHostLayout(layer, {
          stageAlpha: 0,
          hitRegions: starHitRegions(),
          dragActive: dragActive
        });
      }

      VfFrame.attachHeaderDrag({
        root: star,
        header: star,
        layer: layer,
        onDragStart: function () {
          dragActive = true;
          publishStarTransport();
        },
        onDragMove: publishStarTransport,
        onDragEnd: function () {
          dragActive = false;
          publishStarTransport();
        }
      });

      VfAlphaHitMask.rasterizeSvg(star, { alphaThreshold: 0 }).then(function (mask) {
        localAlphaRegions = mask.regions;
        star.setAttribute("data-mask-ready", "1");
        publishStarTransport();
      });
      window.addEventListener("resize", publishStarTransport, { passive: true });
    })();
  </script>
</body>
</html>
