 const base=new URL('../../public/preview/0.7.5/vf-ui/artifacts/current-labels/',import.meta.url),get=async path=>(await fetch(new URL(path,base))).json(),descriptor=await get('producer.json'),vectors=await get('native-mapping/vectors.json'),binding=await get('native-mapping/binding.json'),files=Object.fromEntries(Object.entries(descriptor.files).map(([name,pin])=>[name,{...pin,url:new URL(pin.url,base).href}])),producer=await loadCurrentWasmLabelProducer({...descriptor,files}),typography=createCurrentNativeTypography({boxes:{},vectors,binding,identity:producer.identity,typeset:(run,pins)=>producer.typeset(run,pins)}),rows=['a','b','c','d'].map((name,i)=>({id:'row-'+name,label:name,variable:name,precision:2,min:[.9,-2.1,-5.1,6][i],max:[1.1,-1.9,-4.9,7][i]})),table=await prepareNativeBoundTables({tables:[{id:'coefficients',rows,anchor:[81,180],scale:3,color:[.5,.95,.85,1]}],typography,width:640,height:360,pixelRatio:1});document.body.append(table.element);
