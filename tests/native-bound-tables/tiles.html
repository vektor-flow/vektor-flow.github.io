<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><style>body{margin:0;background:#000}</style><script type="module">
import {prepareNativeBoundTables} from '../../public/preview/0.7.5/vf-ui/native-labels/vf-native-bound-tables.mjs';
import {loadCurrentWasmLabelProducer} from '../../public/preview/0.7.5/vf-ui/native-labels/vf-current-wasm-producer.mjs';
import {createCurrentNativeTypography} from '../../public/preview/0.7.5/vf-ui/native-labels/vf-current-native-provider.mjs';
import {createFrameMovieCapture} from '../../public/preview/0.7.5/vf-ui/vf-frame-movie-capture.mjs';
window.run=async()=>{
 const base=new URL('../../public/preview/0.7.5/vf-ui/artifacts/current-labels/',import.meta.url),get=async path=>(await fetch(new URL(path,base))).json(),descriptor=await get('producer.json'),vectors=await get('native-mapping/vectors.json'),binding=await get('native-mapping/binding.json'),files=Object.fromEntries(Object.entries(descriptor.files).map(([name,pin])=>[name,{...pin,url:new URL(pin.url,base).href}])),producer=await loadCurrentWasmLabelProducer({...descriptor,files}),typography=createCurrentNativeTypography({boxes:{},vectors,binding,identity:producer.identity,typeset:(run,pins)=>producer.typeset(run,pins)}),rows=['a','b','c','d'].map((name,i)=>({id:'row-'+name,label:name,variable:name,precision:2,min:[.9,-2.1,-5.1,6][i],max:[1.1,-1.9,-4.9,7][i]})),table=await prepareNativeBoundTables({tables:[{id:'coefficients',rows,anchor:[window.testAnchor??1062,72],scale:1.5,color:[.5,.95,.85,1]}],typography,width:1280,height:720,pixelRatio:window.testDpr??1});document.body.append(table.element);

 const hash=async bytes=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(n=>n.toString(16).padStart(2,'0')).join('');
 const read=async()=>{const ctx=table.canvas.getContext('2d'),image=ctx.getImageData(0,0,table.canvas.width,table.canvas.height),data=image.data;let before960=0,after960=0,count=0,left=image.width,top=image.height,right=-1,bottom=-1;for(let i=0;i<data.length;i+=4)if(data[i+3]){count++;const x=i/4%image.width,y=Math.floor(i/4/image.width);if(x<960*(window.testDpr??1))before960++;else after960++;left=Math.min(left,x);right=Math.max(right,x);top=Math.min(top,y);bottom=Math.max(bottom,y);}return{count,before960,after960,bounds:[left,top,right,bottom],hash:await hash(data.slice()),width:image.width,height:image.height};};
 try{const frames=[];for(const d of [6,6.37,7,6.37]){const receipt=await table.sample({a:1,b:-2,c:-5,d});frames.push({d,receipt,pixels:await read()});}return{frames,image:table.canvas.toDataURL(),initial:table.receipt()};}finally{table.close();typography.close();producer.close();}
};</script>
