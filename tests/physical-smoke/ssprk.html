  const report={shape:c.shape,checkpoints,clockCases:clocks,partitionReplayBitExact:true,medianTickMs:[...timings].sort((a,b)=>a-b)[9],maxTickMs:Math.max(...timings),timingScope:'Resident GPU three-stage SSPRK and pressure passes, per-tick GPU diagnostic readback; no marker/render/session claim',stateBytes:final.length,ownedBufferBytes:owned.reduce((s,b)=>s+b.size,0)};reports.push(report);console.log('FLUID_SSPRK_CASE_PASS',JSON.stringify(report));for(const b of owned)b.destroy();
 }
