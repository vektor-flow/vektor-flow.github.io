<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><style>body{margin:0;background:black}canvas{width:128px;height:128px}</style>
<script type="module">
import {createScreenSpaceSimplexRenderer} from '../../public/preview/0.7.5/vf-ui/geom/vf-screen-simplex-renderer.mjs';
import {createLayeredCanvasCaptureSource} from '../../public/preview/0.7.5/vf-ui/vf-media-capture.mjs';
import {createFrameMovieCapture} from '../../public/preview/0.7.5/vf-ui/vf-frame-movie-capture.mjs';
window.run=async()=>{const canvas=document.createElement('canvas');document.body.append(canvas);const renderer=createScreenSpaceSimplexRenderer(canvas,{backend:'webgl2',pixelRatio:()=>1});await renderer.initialize();renderer.resize(128,128);renderer.setScene({primitives:[{kind:'face',points:[[16,16],[64,16],[64,112],[16,112]],color:[.95,1,1,.0625]},{kind:'edge',from:[96,0],to:[96,128],width:.8,color:[.95,1,1,.0625]},{kind:'face',points:[[72,16],[88,16],[88,112],[72,112]],color:[1,1,1,1]}]});await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
 const gl=canvas.getContext('webgl2'),raw=new Uint8Array(4);gl.readPixels(32,63,1,1,gl.RGBA,gl.UNSIGNED_BYTE,raw);const copy=document.createElement('canvas');copy.width=copy.height=128;copy.getContext('2d').drawImage(canvas,0,0);const sourceCopy=[...copy.getContext('2d').getImageData(32,64,1,1).data];
 const bg=document.createElement('canvas');bg.width=bg.height=128;bg.getContext('2d').fillStyle='black';bg.getContext('2d').fillRect(0,0,128,128);const capture=createLayeredCanvasCaptureSource({layers:[bg,canvas],beforeDraw:()=>renderer.resize(128,128)}),encoder=await createFrameMovieCapture({width:128,height:128,frameRate:12,codec:new URL(location.href).searchParams.get('codec')||'vp9'});capture.drawFrame({readback:true});const composite=[...capture.canvas.getContext('2d').getImageData(32,64,1,1).data];for(let i=0;i<3;i++){capture.drawFrame({readback:true});const vf=new VideoFrame(capture.canvas,{timestamp:Math.round(i/12*1000000)});try{await encoder.addFrame(vf,i);}finally{vf.close();}}const movie=await encoder.finish();capture.close();return {raw:[...raw],sourceCopy,composite,attributes:gl.getContextAttributes(),blend:{rgbSource:gl.getParameter(gl.BLEND_SRC_RGB),rgbDestination:gl.getParameter(gl.BLEND_DST_RGB),alphaSource:gl.getParameter(gl.BLEND_SRC_ALPHA),alphaDestination:gl.getParameter(gl.BLEND_DST_ALPHA)},bytes:[...new Uint8Array(await movie.arrayBuffer())]};};
</script>
