 const root=new URL('../../public/preview/0.7.5/vf-ui/artifacts/current-labels/',import.meta.url),get=async n=>(await fetch(new URL(n,root))).json(),descriptor=await get('producer.json'),vectors=await get('native-mapping/vectors.json'),binding=await get('native-mapping/binding.json'),files=Object.fromEntries(Object.entries(descriptor.files).map(([n,f])=>[n,{...f,url:new URL(f.url,new URL('producer.json',root)).href}])),producer=await loadCurrentWasmLabelProducer({...descriptor,files}),typography=createCurrentNativeTypography({boxes:{},vectors,binding,identity:producer.identity,typeset:(run,pins)=>producer.typeset(run,pins)});

 result.invalid=[];for(const bad of [{fromIds:[],toId:'a'},{fromIds:['a','a'],toId:'a'},{fromIds:['missing'],toId:'a'},{fromId:'a',fromIds:['b'],toId:'a'},{fromIds:['a','b'],toId:'a',interp:{mode:'wave'}}]){try{const p=await prepare({fromSpecs:[head,a,b],toSpecs:[head,c],rowTransitions:[bad]});p.close();result.invalid.push('ACCEPTED');}catch(e){result.invalid.push(e.code??e.message);}}
