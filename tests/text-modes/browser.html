<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><style>body{margin:0;background:#000;color:#fff}#host{position:relative;width:640px;height:360px;background:#000}.underlay{position:absolute;inset:0}</style><div id="host"><svg class="underlay" width="640" height="360"><path d="M20 330H620" stroke="#29d386"/><circle cx="600" cy="40" r="12" fill="none" stroke="#29d386"/></svg></div>
<script type="module">
import {prepareNativeTextModes} from '../../public/preview/0.7.5/vf-ui/native-labels/vf-native-text-modes.mjs';
import {loadCurrentWasmLabelProducer} from '../../public/preview/0.7.5/vf-ui/native-labels/vf-current-wasm-producer.mjs';
import {createCurrentNativeTypography} from '../../public/preview/0.7.5/vf-ui/native-labels/vf-current-native-provider.mjs';
const root=new URL('../../public/preview/0.7.5/vf-ui/artifacts/current-labels/',import.meta.url),get=async n=>(await fetch(new URL(n,root))).json();
window.start=async()=>{
 const descriptor=await get('producer.json'),vectors=await get('native-mapping/vectors.json'),binding=await get('native-mapping/binding.json');
 const files=Object.fromEntries(Object.entries(descriptor.files).map(([n,f])=>[n,{...f,url:new URL(f.url,new URL('producer.json',root)).href}]));
 const producer=await loadCurrentWasmLabelProducer({...descriptor,files});
 const typography=createCurrentNativeTypography({boxes:{},vectors,binding,identity:producer.identity,typeset:(run,pins)=>producer.typeset(run,pins)});
 const make=(id,source,y,color)=>({id,kind:'math',source:'\\text{'+source+'}',anchor:[50,y],scale:2.5,color,sizeSpace:'css'});
 const controller=new AbortController();
 const prepared=await prepareNativeTextModes({fromSpecs:[make('out','Outgoing ink',100,[.9,.95,1,1])],toSpecs:[make('first','First row',160,[1,.85,.4,1]),make('second','Second row',220,[.65,.9,1,1])],width:640,height:360,pixelRatio:1,typography,interp:{mode:'vapor',seed:17},maxCarriers:512,signal:controller.signal});
 document.querySelector('#host').append(prepared.element);window.player=prepared;
 window.spectral=async()=>{
  prepared.close();
  const p=await prepareNativeTextModes({toSpecs:[make('one','First row',160,[1,1,1,1]),make('two','Second row',220,[1,1,1,1])],width:640,height:360,pixelRatio:1,typography,interp:{mode:'spectral'},maxCarriers:32});document.querySelector('#host').append(p.element);window.player=p;return p.sample(0.4);
 };
 window.oscillator=async(legends=false)=>{
  window.player.close();const width=1280,height=720;
  document.querySelector('#host').style.cssText='position:relative;width:1280px;height:720px;background:#000';
  const row=(id,source,x,y,scale,itemIndex)=>({id,kind:'math',source,anchor:[x*width,y*height],scale,color:[.95,.97,1,1],sizeSpace:'css',...(itemIndex===undefined?{}:{itemIndex})});
  const fixture=await (await fetch('./oscillator.json')).json(),view=fixture.views[0];
  const specs=[row('title','\\text{'+view.title+'}',.06,.12,3.6),...view.equations.map((v,i)=>row('eq'+i,v,.06,.24+i*40*2.7/2/height,2.7,i)),...view.notes.map((v,i)=>row('note'+i,'\\bullet\\quad\\text{'+v+'}',.06,.5+i*40*2.2/2/height,2.2,i))];
  if(legends)specs.push({...row('displacement','\\text{Displacement}',.06,.7,2.2),color:[120/255,211/255,198/255,1]},{...row('phase','\\text{Phase}',.79,.64,2.2),color:[120/255,211/255,198/255,1]});
  const p=await prepareNativeTextModes({toSpecs:specs,width,height,pixelRatio:1,typography,interp:{mode:'spectral'},maxCarriers:32});document.querySelector('#host').append(p.element);window.player=p;return {glyphs:p.targetCount};
 };
 window.invalid=async()=>{try{await prepareNativeTextModes({typography,width:640,height:360,interp:{mode:'spectral',seed:1}});return false;}catch(e){return e.code==='NATIVE_TEXT_MODE_PARAMETER';}};
 window.cleanup=()=>{window.player.close();controller.abort();typography.close();producer.close();};
 return {sources:prepared.sourceCount,targets:prepared.targetCount};
};
</script>
